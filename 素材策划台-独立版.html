<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>素材策划台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 左侧"策划单"表单（桌面端吸顶），右侧逐节生成的策划案文档 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#152B27; --muted:#5A6A65; --line:#D8DFDB;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --hl:#F6D776; --hl-ink:#3B2E00;
  --risk:#B8392A; --risk-bg:#FBE7E3; --ok:#2C7A4B; --soft:#E7EEEA;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --ink:#E3ECE8; --muted:#94A49E; --line:#283632;
  --accent:#4DBFA3; --accent-ink:#06201A; --hl:#6B5413; --hl-ink:#FFF3CC;
  --risk:#F08A74; --risk-bg:#3A1D18; --ok:#6FCF97; --soft:#1C2A26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --ink:#E3ECE8; --muted:#94A49E; --line:#283632;
  --accent:#4DBFA3; --accent-ink:#06201A; --hl:#6B5413; --hl-ink:#FFF3CC;
  --risk:#F08A74; --risk-bg:#3A1D18; --ok:#6FCF97; --soft:#1C2A26; color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
details.api{border:1px solid var(--line);border-radius:4px;background:var(--bg)}
details.api summary{cursor:pointer;padding:8px 10px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
details.api .api-b{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px}
details.api input,details.api select{background:var(--surface)}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0}
.inline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.avail{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.avail.on .dot{background:var(--ok)} .avail.off .dot{background:var(--risk)}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* 表单 */
form.brief{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){form.brief{position:static}}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.form-head h2{font-family:var(--f-display);font-size:18px;margin:0}
.chip{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--hl);color:var(--hl-ink);letter-spacing:.04em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend{font-size:13px;font-weight:500;padding:0;margin-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;padding:6px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin:0}
.msg{font-size:13px;padding:8px 10px;border-radius:4px;background:var(--risk-bg);color:var(--risk)}

/* 输出 */
.doc-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.doc-bar h2{font-family:var(--f-display);font-size:22px;margin:0;min-width:0;overflow-wrap:anywhere}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.secs{display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:17px;flex:1;min-width:0}
.idx{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.run{background:var(--hl);color:var(--hl-ink)} .pill.done{color:var(--ok)} .pill.err{background:var(--risk-bg);color:var(--risk)}
.sec-b{padding:4px 18px 18px;min-width:0}
.sec-b .placeholder{color:var(--muted);font-size:14px;padding-top:12px}
.thinking{color:var(--muted);font-size:14px;padding-top:12px;display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::before{animation:none}}

.md{font-size:14.5px;overflow-wrap:anywhere}
.md h2{font-family:var(--f-display);font-size:19px;margin:18px 0 8px}
.md h3{font-size:16px;margin:18px 0 6px;padding-top:12px;border-top:1px dashed var(--line)}
.md h4{font-size:14.5px;margin:12px 0 4px}
.md p{margin:6px 0;max-width:72ch}
.md ul,.md ol{padding-left:1.4em;margin:6px 0}
.md strong{font-weight:700}
.md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);padding:1px 4px;border-radius:3px}
.table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:4px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;min-width:64px}
.md th{background:var(--soft);font-weight:700;white-space:nowrap}
.md tr:last-child td{border-bottom:0}
mark.risk{background:var(--risk-bg);color:var(--risk);font-weight:700;padding:0 2px;border-radius:2px}
.trunc{font-size:12px;color:var(--risk);margin-top:8px}

/* 合规面板 */
.compliance .sec-b ul{list-style:none;padding:0;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px}
.compliance li{font-size:13px;padding:3px 10px;border-radius:4px;background:var(--risk-bg);color:var(--risk)}
.compliance li span{font-family:var(--f-mono);font-size:11px;opacity:.8;margin-left:4px}
.clean{color:var(--ok);font-size:14px;padding-top:12px}

.outline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.outline li{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.outline li:last-child{border-bottom:0}
.outline b{display:block;font-size:15px}
.outline span{color:var(--muted);font-size:13px}
.outline .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>素材策划台</h1>
      <p>填一张策划单，生成短视频、小红书图文、信息流广告的完整素材策划案：洞察、创意评分、脚本分镜、文案、排期和广告法自查。</p>
    </div>
    <div class="avail" id="avail"><span class="dot"></span><span id="availText">未设置 API Key</span></div>
  </header>

  <div class="grid">
    <form class="brief" id="form" novalidate>
      <details class="api" id="apiBox">
        <summary><span>模型接口设置</span><span id="apiSum" style="color:var(--muted);font-weight:400"></span></summary>
        <div class="api-b">
          <label class="f">服务商<select id="provider">
            <option value="anthropic">Claude（Anthropic 官方 API）</option>
            <option value="deepseek">DeepSeek</option>
            <option value="qwen">通义千问（阿里云百炼）</option>
            <option value="kimi">Kimi（月之暗面）</option>
            <option value="glm">智谱 GLM</option>
            <option value="openai">OpenAI</option>
            <option value="custom">其他 OpenAI 兼容接口</option>
          </select></label>
          <label class="f">接口地址<input type="text" id="baseUrl" spellcheck="false"></label>
          <label class="f">模型名称 <small>以服务商控制台为准，可自行修改</small><input type="text" id="model" spellcheck="false"></label>
          <label class="f">API Key
            <span class="keyrow"><input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="粘贴你的 API Key"><button type="button" class="ghost" id="showKey">显示</button></span>
          </label>
          <label class="inline"><input type="checkbox" id="rememberKey" checked>在这台电脑的浏览器里记住 Key</label>
          <p class="note">Key 只保存在你自己的浏览器里，请求直接发到服务商，不经过任何第三方。不要把填好 Key 的电脑借给别人用。</p>
        </div>
      </details>
      <div class="form-head"><h2>策划单</h2><span class="chip" id="sampleChip">示例数据</span></div>
      <label class="f">产品 / 主题 *<input type="text" id="name" required maxlength="80"></label>
      <label class="f">品类与简介<textarea id="desc" rows="2"></textarea></label>
      <label class="f">核心卖点 <small>1–3 个，用分号隔开</small><textarea id="sell" rows="2"></textarea></label>
      <div class="row2">
        <label class="f">价格带<input type="text" id="price"></label>
        <label class="f">目标<select id="goal">
          <option>种草 + 转化</option><option>种草</option><option>拉新</option><option>转化</option><option>品牌曝光</option>
        </select></label>
      </div>
      <label class="f">目标人群<input type="text" id="audience"></label>
      <fieldset>
        <legend>投放平台</legend>
        <div class="checks">
          <label><input type="checkbox" id="p_video" checked>短视频</label>
          <label><input type="checkbox" id="p_xhs" checked>小红书图文</label>
          <label><input type="checkbox" id="p_ads" checked>信息流广告</label>
        </div>
      </fieldset>
      <div class="row2">
        <label class="f">调性<select id="tone">
          <option>让 AI 建议</option><option>专业可信</option><option>亲切真实</option><option>轻松搞笑</option><option>高级质感</option>
        </select></label>
        <label class="f">条数<select id="qty">
          <option value="std">标准（3 / 3 / 5）</option><option value="lite">精简（1 / 1 / 2）</option>
        </select></label>
      </div>
      <label class="f">禁忌 / 不能说的<input type="text" id="taboo"></label>
      <label class="f">参考资料 <small>可选。粘贴竞品文案、用户评论、热点话题，结论会更准</small><textarea id="ref" rows="3" placeholder="例如：竞品小红书爆文标题、电商差评原话……"></textarea></label>
      <div class="actions">
        <button type="submit" class="primary" id="go">生成策划案</button>
        <button type="button" id="stop" hidden>停止</button>
        <button type="button" class="ghost" id="clear">清空</button>
      </div>
      <p class="msg" id="formMsg" hidden></p>
      <p class="note">模型不会联网搜索。研究部分基于参考资料和行业常识，常识推断会标注"建议核实"。生成约 1–3 分钟，费用按你的 API 用量计。</p>
    </form>

    <main>
      <div class="doc-bar">
        <h2 id="docTitle">策划案会出现在这里</h2>
        <div class="actions">
          <span class="progress" id="progress"></span>
          <button type="button" class="ghost" id="copyAll" disabled>复制全文</button>
          <button type="button" class="ghost" id="dl" disabled>下载 .md</button>
        </div>
      </div>
      <div class="secs" id="secs"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>/**

        const data = line.slice(5).trim();

        onEvent(ev);

    const ctl = new AbortController(); controllers.add(ctl);
    s.status = "think"; s.text = ""; s.truncated = false; s.error = ""; renderSec(id); updateBar();
    try {
      const r = await callLLM(promptFor(id, f, baseText), {
        signal: ctl.signal,
        onText: ({ text }) => { s.text = text; s.status = "stream"; scheduleRender(id); }
      });
      s.text = r.text; s.truncated = r.truncated; s.status = "done";
      return true;
    } catch (e) {
      s.text = e?.text || ""; s.status = "err"; s.error = errText(e);
      if (["no_key", "auth", "not_found", "network"].includes(e?.code)) { showFormMsg(s.error); if (e.code !== "network") $("apiBox").open = true; }
      return false;
    } finally {
      controllers.delete(ctl); renderSec(id); renderComp(); updateBar(); save();
    }
  }

  async function generate(f) {
    running = true;
    const order = ["base"];
    if (f.p_video) order.push("video"); if (f.p_xhs) order.push("xhs"); if (f.p_ads) order.push("ads");
    order.push("exec");
    state = { form: f, order, secs: {} };
    order.forEach(id => state.secs[id] = { status: id === "base" ? "think" : "wait", text: "" });
    $("docTitle").textContent = `${f.name.replace(/（示例）$/, "")} 素材策划案`;
    buildSections(); updateBar();
    const ok = await runSection("base", f);
    if (ok) {
      await Promise.allSettled(order.slice(1).map(id => runSection(id, f, state.secs.base.text)));
    } else {
      order.slice(1).forEach(id => { state.secs[id].status = "idle"; renderSec(id); });
    }
    running = false; updateBar(); state.order.forEach(renderSec); renderComp(); save();
    if (ok && state.order.every(id => state.secs[id].status === "done")) toast("策划案已生成");
  }

  async function regen(id) {
    if (running) return;
    running = true; updateBar();
    const f = state.form;
    if (id === "base") {
      await generate(f); return;
    }
    await runSection(id, f, state.secs.base?.text || "");
    running = false; updateBar(); state.order.forEach(renderSec);
  }

  function showFormMsg(t) { const m = $("formMsg"); m.textContent = t; m.hidden = !t; }
  $("form").addEventListener("submit", e => {
    e.preventDefault(); showFormMsg("");
    const f = readForm();
    if (!f.name) { showFormMsg("请先填写产品或主题。"); $("name").focus(); return; }
    if (!f.p_video && !f.p_xhs && !f.p_ads) { showFormMsg("至少选一个投放平台。"); return; }
    const c = apiCfg();
    if (!c.key || !c.base || !c.model) { showFormMsg("请先在「模型接口设置」里填写 API Key。"); $("apiBox").open = true; $("apiKey").focus(); return; }
    generate(f);
  });
  $("stop").addEventListener("click", () => controllers.forEach(c => c.abort()));

  // ---------- 导出 ----------
  function fullMarkdown() {
    const f = state.form || {};
    const parts = [`# ${(f.name || "").replace(/（示例）$/, "")} 素材策划案`, `生成日期：${todayStr}`, ""];
    state.order.forEach(id => { if (state.secs[id].text) parts.push(state.secs[id].text.trim(), ""); });
    const hits = scanRisks(); const keys = Object.keys(hits);
    parts.push("## 广告法自查", keys.length ? keys.map(k => `- ${k} ×${hits[k].n}（${[...hits[k].where].join(" / ")}）`).join("\n") + "\n\n以上词语可能属于绝对化用语，发布前请改写或确认语境。" : "未扫到常见极限词。发布前仍需人工复核。");
    return parts.join("\n");
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast("已复制"); }
    catch {
      const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast("已复制"); } catch { toast("复制失败，请手动选择文字"); } ta.remove();
    }
  }
  $("copyAll").addEventListener("click", () => copyText(fullMarkdown()));
  $("dl").addEventListener("click", () => {
    const name = `${(state.form?.name || "策划案").replace(/（示例）$/, "").replace(/[\\/:*?"<>|]/g, "")}-素材策划案.md`;
    try {
      const url = URL.createObjectURL(new Blob([fullMarkdown()], { type: "text/markdown;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("已开始下载");
    } catch { copyText(fullMarkdown()); toast("下载失败，已改为复制全文"); }
  });

  let toastTimer;
  function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2200); }

  // ---------- 本地记忆（仅本浏览器） ----------
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ draft: readForm(), plan: running ? null : state })); } catch {}
  }
  let draftTimer;
  $("form").addEventListener("input", () => { clearTimeout(draftTimer); draftTimer = setTimeout(save, 400); });

  // ---------- 启动 ----------
  let saved = null; try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch {}
  fillForm(saved?.draft || SAMPLE);
  if (saved?.plan?.order?.length && saved.plan.order.some(id => saved.plan.secs?.[id]?.text)) {
    state = saved.plan;
    state.order.forEach(id => { const s = state.secs[id]; if (!["done", "err"].includes(s.status)) s.status = s.text ? "done" : "idle"; });
    $("docTitle").textContent = `${(state.form?.name || "").replace(/（示例）$/, "")} 素材策划案`;
    buildSections(); updateBar();
  } else {
    renderEmpty(); updateBar();
  }
})();
</script>
</body>
</html>
